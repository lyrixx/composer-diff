name: Build the public website, and publish to GitHub Pages

on:
    push:
        branches: ["main"]

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{steps.deployment.outputs.page_url}}
        steps:
            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Checkout
              uses: actions/checkout@v7

            - name: Install castor
              uses: castor-php/setup-castor@v1

            # The GitHub Actions cache of buildx needs the docker-container
            # driver, and the runtime token and URLs, that only actions get
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Expose GitHub runtime
              uses: crazy-max/ghaction-github-runtime@v4

            - name: Build
              run: |
                  set -x
                  castor app:install
                  castor app:build \
                      --set '*.cache-from=type=gha' \
                      --set '*.cache-to=type=gha,mode=max,ignore-error=true'
              env:
                  BUILDKIT_PROGRESS: plain

            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "public"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
